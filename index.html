<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServGui - Loja de Bebidas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>ServGui</h1>
            <p>Loja de Bebidas</p>
        </div>
    </header>

    <main class="container">
        <section class="cadastro">
            <h2>Cadastro de bebidas</h2>

            <form id="form-produto">
                <div class="campo">
                    <label for="nome">Nome da bebida</label>
                    <input type="text" id="nome" placeholder="Ex.: Cerveja" required>
                </div>

                <div class="campo">
                    <label for="preco">Preço</label>
                    <input type="number" id="preco" placeholder="Ex.: 8.50" step="0.01" min="0.01" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" placeholder="Ex.: 30" min="1" required>
                </div>

                <p id="mensagem" class="mensagem"></p>

                <button type="submit" id="botao-formulario">Adicionar produto</button>
            </form>
        </section>

        <section class="produtos">
            <div class="titulo-lista">
                <h2>Produtos cadastrados</h2>
                <span id="contador">Produtos cadastrados: 0</span>
            </div>

            <p id="lista-vazia" class="lista-vazia">Nenhum produto cadastrado.</p>

            <ul id="lista-produtos"></ul>
        </section>
    </main>

    <footer>
        <p>ServGui - Projeto desenvolvido para a atividade de Fundamentos Web.</p>
        <p>HTML, CSS e JavaScript puro.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
